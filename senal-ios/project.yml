name: SenalTV
options:
  bundleIdPrefix: com.senal
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.5.3"
    CURRENT_PROJECT_VERSION: "18"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: SenalTV/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: SEÑAL
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  SenalTV:
    type: application
    platform: iOS
    sources:
      - path: SenalTV
        excludes:
          - "Resources/**"
          - "Catalog/**"
          - "**/*.m3u"
          - "**/*.m3u.gz"
          - "**/*.dat"
          - "**/.DS_Store"
          - "Info.plist"
    resources:
      # Explicit files so Xcode always copies them into the .app
      - path: SenalTV/Catalog/playlist.dat
        buildPhase: resources
      - path: SenalTV/Catalog/playlist.m3u
        buildPhase: resources
      - path: SenalTV/Resources/lista_fusionada.m3u
        buildPhase: resources
      - path: SenalTV/Resources/lista_fusionada.m3u.gz
        buildPhase: resources
      - path: SenalTV/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senal.tv
        PRODUCT_NAME: SenalTV
        INFOPLIST_FILE: SenalTV/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SEÑAL
schemes:
  SenalTV:
    build:
      targets:
        SenalTV: all
    run:
      config: Debug
    archive:
      config: Release

name: SenalTV
options:
  bundleIdPrefix: com.senal
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "15"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: SEÑAL
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  SenalTV:
    type: application
    platform: iOS
    sources:
      - path: SenalTV
        excludes:
          - "Resources/**"
          - "**/*.m3u"
          - "**/*.m3u.gz"
          - "**/.DS_Store"
    resources:
      - path: SenalTV/Resources
      - path: SenalTV/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senal.tv
        PRODUCT_NAME: SenalTV
        INFOPLIST_KEY_CFBundleDisplayName: SEÑAL
        INFOPLIST_KEY_UIBackgroundModes: "audio"
schemes:
  SenalTV:
    build:
      targets:
        SenalTV: all
    run:
      config: Debug
    archive:
      config: Release

name: Build SEÑAL iOS

on:
  push:
    paths:
      - "senal-ios/**"
      - "lista_fusionada.m3u"
      - ".github/workflows/senal-ios.yml"
  pull_request:
    paths:
      - "senal-ios/**"
      - ".github/workflows/senal-ios.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: senal-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Xcode project + compile
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync playlist into iOS Resources
        run: |
          mkdir -p senal-ios/SenalTV/Resources
          if [ -f lista_fusionada.m3u ]; then
            cp lista_fusionada.m3u senal-ios/SenalTV/Resources/lista_fusionada.m3u
            gzip -c -9 lista_fusionada.m3u > senal-ios/SenalTV/Resources/lista_fusionada.m3u.gz
          fi
          ls -lh senal-ios/SenalTV/Resources/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: senal-ios
        run: xcodegen generate

      - name: Build (unsigned simulator — verifies compile)
        working-directory: senal-ios
        run: |
          xcodebuild \
            -scheme SenalTV \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive (device, signing optional)
        working-directory: senal-ios
        continue-on-error: true
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "${IOS_TEAM_ID:-}" ]; then
            echo "Team secret present — attempting signed archive"
            xcodebuild \
              -scheme SenalTV \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath dist/SenalTV.xcarchive \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              archive
          else
            echo "No IOS_TEAM_ID secret — building unsigned .app for packaging reference"
            xcodebuild \
              -scheme SenalTV \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              BUILD_DIR="$PWD/dist/DerivedData" \
              build
            APP=$(find dist/DerivedData -name 'SenalTV.app' -type d | head -1 || true)
            if [ -n "$APP" ]; then
              mkdir -p dist/Payload
              cp -R "$APP" dist/Payload/
              (cd dist && zip -qry SenalTV-UNSIGNED.ipa Payload)
              echo "Created UNSIGNED ipa (will NOT install on stock iPhone without resign)."
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SenalTV-iOS
          path: |
            senal-ios/SenalTV.xcodeproj
            senal-ios/dist/**
          if-no-files-found: warn
          retention-days: 30

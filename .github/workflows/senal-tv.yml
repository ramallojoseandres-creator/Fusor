name: Build SEÑAL TV APK

on:
  push:
    paths:
      - "senal-tv/**"
      - ".github/workflows/senal-tv.yml"
  pull_request:
    paths:
      - "senal-tv/**"
      - ".github/workflows/senal-tv.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: senal-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install platform and build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            senal-tv/.gradle
          key: gradle-senal-${{ runner.os }}-${{ hashFiles('senal-tv/**/*.gradle*', 'senal-tv/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-senal-${{ runner.os }}-

      - name: Build debug APK
        working-directory: senal-tv
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenalTV-debug
          path: senal-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Rename APK for download clarity
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp senal-tv/app/build/outputs/apk/debug/app-debug.apk \
            "dist/SEÑAL-TV-${{ github.sha }}.apk"

      - name: Upload named APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SenalTV-debug-named
          path: dist/*.apk
          retention-days: 30

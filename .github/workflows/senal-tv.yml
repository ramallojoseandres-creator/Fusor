name: Build SEÑAL TV APK

on:
  push:
    paths:
      - "senal-tv/**"
      - "lista_fusionada.m3u"
      - ".github/workflows/senal-tv.yml"
  pull_request:
    paths:
      - "senal-tv/**"
      - "lista_fusionada.m3u"
      - ".github/workflows/senal-tv.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: senal-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install platform and build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            senal-tv/.gradle
          key: gradle-senal-${{ runner.os }}-${{ hashFiles('senal-tv/**/*.gradle*', 'senal-tv/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-senal-${{ runner.os }}-

      - name: Sync embedded M3U catalog from repo root
        run: |
          mkdir -p senal-tv/app/src/main/assets/catalog
          if [ -f lista_fusionada.m3u ]; then
            gzip -c -9 lista_fusionada.m3u > senal-tv/app/src/main/assets/catalog/lista_fusionada.m3u.gz
            ls -lh senal-tv/app/src/main/assets/catalog/lista_fusionada.m3u.gz
          else
            echo "lista_fusionada.m3u missing — using committed asset"
            ls -lh senal-tv/app/src/main/assets/catalog/ || true
          fi

      - name: Build debug APKs (TV + Mobile)
        working-directory: senal-tv
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleTvDebug :app:assembleMobileDebug --no-daemon --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p dist
          cp senal-tv/app/build/outputs/apk/tv/debug/app-tv-debug.apk dist/SenalTV.apk
          cp senal-tv/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk dist/SenalMobile.apk
          unzip -t dist/SenalTV.apk >/dev/null
          unzip -t dist/SenalMobile.apk >/dev/null
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenalTV-apk
          path: |
            dist/SenalTV.apk
            dist/SenalMobile.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release with APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/senal-tv-android-807c' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: senal-tv-${{ github.run_number }}
          name: SEÑAL TV build ${{ github.run_number }}
          body: |
            APKs listos:

            - **SenalTV.apk** — Android TV / Fire TV (mando)
            - **SenalMobile.apk** — tablet / teléfono (táctil)

            1. Descarga el APK correcto (no el .zip de Actions)
            2. Instálalo permitiendo orígenes desconocidos
          files: |
            dist/SenalTV.apk
            dist/SenalMobile.apk
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

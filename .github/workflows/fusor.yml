name: Fusionar listas M3U
on:
  push: {}
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fusionar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Fusionar y verificar
        run: rm -f lista_fusionada.m3u && bash fusor.sh *.m3u
      - name: Guardar resultado
        run: git config user.name "bot" && git config user.email "bot@users.noreply.github.com" && git add lista_fusionada.m3u && (git diff --cached --quiet || git commit -m "Lista actualizada") && git push

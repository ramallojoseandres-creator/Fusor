name: vitalfiapps
description: ResQRadar / VitalFi VE — radar táctico de rescate por Wi-Fi (fork MIT)
publish_to: "none"
version: 1.4.0+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  wakelock_plus: ^1.2.8
  firebase_core: ^3.8.1
  firebase_database: ^11.2.0
  dart_ping: ^9.0.1
  flutter_compass: ^0.8.1
  audioplayers: ^6.1.0
  network_info_plus: ^6.1.2
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  path_provider: ^2.1.5
  flutter_map_cache: ^1.5.2
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^4.0.0
  share_plus: ^10.1.3
  sqflite: ^2.4.1
  path: ^1.9.0
  tflite_flutter: ^0.11.0
  nearby_connections: ^4.3.0
  shared_preferences: ^2.3.3
  sensors_plus: ^6.1.1
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/model_vitalfi.tflite
    - assets/splash_bg.png
    - assets/models/
    - assets/sounds/

